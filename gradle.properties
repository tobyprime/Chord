org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# 多版本支持（参照 Mcedia）：每个版本一个 fabric/versions/<mc>/ 子项目，
# 各自的 gradle.properties 携带 minecraft_version / fabric_api_version / java_version
supported_mc_versions=1.21.11,26.2,26.3

loomVersion=1.18.2
foliaApiVersion=26.2.build.7-beta

# Gradle 工具链自动探测（1.21.11 用 Java 21、26.x 用 Java 25 的编译目标）
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK_HOME,JDK21_HOME,JDK25_HOME
