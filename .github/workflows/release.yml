name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml (gen-sounds-json.py)
        run: pip install pyyaml

      - name: Set up Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build (protocol + fabric + plugin)
        run: ./gradlew build --no-daemon

      - name: Verify sounds.json is in sync with instruments.yml
        run: |
          python tools/gen-sounds-json.py
          git diff --exit-code assets/resourcepack/assets/chord/sounds.json

      - name: Pack chord.zip
        run: python tools/build-pack.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fab="fabric/build/libs/fabric-${VERSION}.jar"
          plug="plugin/build/libs/plugin-${VERSION}.jar"
          test -f "$fab" || { echo "缺少 $fab"; exit 1; }
          test -f "$plug" || { echo "缺少 $plug"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --title "Chord ${VERSION}" \
            --notes "Chord ${VERSION}

          ## 安装
          - **服务端**（Folia/Paper 26.2）：\`plugin-${VERSION}.jar\` 放入 \`plugins/\`，重启；下发 \`chord.zip\` 乐器采样资源包
          - **演奏者**（Fabric 26.2）：\`fabric-${VERSION}.jar\` 放入 \`.minecraft/mods/\`
          - **聆听者**：零安装

          详细说明见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)。采样来源与许可证（全部 CC0）见 \`assets/resourcepack/README.md\`。" \
            "$fab" "$plug" assets/resourcepack/chord.zip
