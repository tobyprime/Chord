# Chord 乐器定义
#
# 通用字段：
#   display-name    显示名
#   base-item       底子物品（发放给玩家的原版物品；原版旁观者看到的就是它）
#   semitone-range  [最小, 最大] 相对中心音的半音偏移；客户端据此灰显超域键位
#   volume          音量/可听距离：约 16×volume 格（1.0 ≈ 16 格，2.0 ≈ 32 格）
#   max-polyphony   复音容量（默认 6）：「按住中」的最大同时音符数。两处生效：客户端
#                   MIDI 转换的自动单音收敛阈值（原始复音超过该值才收敛单旋律——电钢琴
#                   真弹录音复音 7+，按默认 6 会把左手/和弦内声部整只削掉，故钢琴十指
#                   给 10）；非 sustain 乐器的服务端和弦上限（0.7.9 起 sustain 乐器
#                   不设服务端上限——MIDI 踏板烘焙会把松开的音留在活跃表合法堆叠，
#                   且活跃表按半音建键天然有界，滥用由限速器约束）。
#   category        声音分类（RECORDS/MUSIC/MASTER...），影响客户端音量滑条
#
# voices：分音区路由表，按顺序首个命中区间的生效。
#   pitch(semitone) = base-pitch × 2^(semitone/12)，客户端最终钳制在 [0.5, 2.0]。
#   sound 支持逐音符事件模板（含 %d，%d = 半音偏移，如 chord:harmonica.c4.-3）：
#   资源包为每个半音注册独立事件（指向同一采样文件），插件停音时对该事件精确 stopSound，
#   实现「按住持续发声、松开即停」且互不影响和弦中的其他音。
#   不含 %d 的普通事件无 note-off，播完整条采样（如 fallback 的原版音符盒音色）。
#   base-pitch 换算：采样实测音高为 center + c（c = 采样相对中心音的半音数）时
#   base-pitch = 2^(−c/12)。
#   fixed: true     打击乐行：pitch 恒等于 base-pitch，半音只用来选鼓件、不变调
#                   （否则同一鼓件会被半音偏移「变调」成低音军鼓/高音军鼓）。
#   label: "大鼓"   区间显示名，随 chord:sync 下发客户端（HUD/直排音配置屏显示；
#                   无 label 的乐器显示音级名 低1/高2♯…）。鼓件布局靠它可读。
#
# 当前采样（VCSL Hohner Super 64，实测音名，中心音 = C4）：
#   0.7.14 起 12 锚点网格（C3~G6 每 3~4 半音一个实测采样，见 voices 表内注释），
#   常用区间拉伸 ≤±2 半音；仅底部 C2~B2 借 C3 采样下探（最多 −12，真实乐器 C3 起）。
# 拼接覆盖 [−24, +31]（C2~G6）。semitone-range 直接放开到采样全域：默认音级键可达
# [−12, +25]（低1~高6♯），更高/更低的音（低低音、高高音）经 chord.json 的 direct_notes
# 直排音键绑定演奏；底部一个八度的下探变速会把音色压窄，属采样乐器的正常表现。
#
# fallback-voices：可选，未接受资源包玩家的降级音色（V1 仅解析存储，
# 按聆听者定向下发在 V1.2 启用；原版音符盒音色无 note-off，长音播完整条采样）。

harmonica:
  display-name: "守夜人口琴"
  base-item: GOAT_HORN
  semitone-range: [-24, 31]   # C2~G6：低低1 ~ 高高5（高高5♯）
  volume: 1.0
  max-polyphony: 6            # 旋律乐器：自动单音收敛阈值默认值
  category: RECORDS
  voices:
    # 0.7.14：12 锚点网格（VCSL Super 64 全部 C/E/G 录音，实测基频换算 base-pitch），
    # 拉伸 ≤±2 半音（旧 3 锚点 ±12 拉伸是「电子感」的根因）；底部 C2~B2 仍借 C3 下探
    #（真实 Super 64 自 C3 起）；RMS 已对齐 −11.3dB（旧三层平均水平，混音平衡不变）
    - { min: -24, max: -10, sound: "chord:harmonica.c3.%d",  base-pitch: 2.0028962 }
    - { min: -9,  max: -7,  sound: "chord:harmonica.e3.%d",  base-pitch: 1.5923983 }
    - { min: -6,  max: -3,  sound: "chord:harmonica.g3.%d",  base-pitch: 1.3369068 }
    - { min: -2,  max: 2,   sound: "chord:harmonica.c4.%d",  base-pitch: 0.9993443 }
    - { min: 3,   max: 5,   sound: "chord:harmonica.e4.%d",  base-pitch: 0.7940330 }
    - { min: 6,   max: 9,   sound: "chord:harmonica.g4.%d",  base-pitch: 0.6675157 }
    - { min: 10,  max: 14,  sound: "chord:harmonica.c5.%d",  base-pitch: 0.5001084 }
    - { min: 15,  max: 17,  sound: "chord:harmonica.e5.%d",  base-pitch: 0.3967474 }
    - { min: 18,  max: 21,  sound: "chord:harmonica.g5.%d",  base-pitch: 0.3336099 }
    - { min: 22,  max: 26,  sound: "chord:harmonica.c6.%d",  base-pitch: 0.2500739 }
    - { min: 27,  max: 29,  sound: "chord:harmonica.e6.%d",  base-pitch: 0.1983322 }
    - { min: 30,  max: 31,  sound: "chord:harmonica.g6.%d",  base-pitch: 0.1668348 }
  fallback-voices:
    - { min: -12, max: 12, sound: "block.note_block.bit", base-pitch: 1.0 }

# 世界装置乐器：entry: world，无物品形态，右键交互实体进入演奏态。
# 识别两种方式（chord 标记优先）：
#   1. 声明式 world-bind（推荐）：实体 PDC 任意字符串值/自定义名命中 match-values 或
#      match-regex 即视为本乐器——CraftEngine 等家具插件会在命中箱上自带家具标识，
#      放置即生效、零逐台配置。用 /chord piano inspect 查看实体实际标识后填入。
#   2. 手动标记（兜底）：/chord piano spawn 生成自带标记的实体，
#      或 /chord piano bind 给任意交互实体打 chord 标记。
# 音符校验：进入时服务端记住所点实体（会话），演奏必须仍在该实体 8 格内；实体被拆除即失效。
# 退出：蹲下或走远（客户端 8 格自动退出，服务端同值校验）。
# release-mode（释放模式）：
#   stop    （默认，口琴）松键立刻止音——气息类乐器嘴离开就停，符合直觉。
#   decay   （吉他/贝斯/鼓）松键不立刻止音，采样自然衰减出音尾；K 键 = 瞬时闷音
#           （手掌闷音语义），退出演奏态/断线自动硬止音。
#   sustain （钢琴）真钢琴制音器语义：默认松键即制音（150ms 制音器落弦缓冲，
#           期间被同半音重击或踏板踩下「接住」则取消）；K 键 = **按住生效的延音踏板**
#           ——踩住期间松键的音进余音表延续，松开踏板掐掉所有「键已松开」的余音
#           （按住中的键不受影响）。抬键后 150ms 内踩踏板仍能接住余振（踏板时机捕捉）。
# 钢琴采样（VCSL Steinway B Sus vl3，实测 C3 / E4 / G#5，中心音 = C4）：
#   high 为 G#5（c=+20 → base-pitch 0.31498，有效区间 [+8, +32]），故 mid 延到 +7、high 从 +8 起。
# 力度层（0.6.0，协议 v6）：vl2 柔音（velocity 1~63）/ vl4 强音（114~127）采样层，
# 中间力度（64~113）回落到上面的常规 voices（vl3）。三层同 14 锚点网格，力度还同时
# 缩放音量（100=基准 ×1.0，127 ≈ ×1.27）。
# 演奏端默认力度 100（常规层），演奏态滚轮上下可调 40~127（跨进柔音/强音层），磁轴键盘等
# 模拟输入源的逐键真实力度走同一字段（V2 适配器）。
#
# 锚点网格（0.7.16）：14 锚点纯四度间隔（A#0~F#7，VCSL JHPiano 每全音一个采样）。
# 旧 5 锚点版（C1~C7）high 窗向上拉满 12 半音（B5~G#6 pitch 1.2~2.0），高音
# chipmunk 失真在 B5/C6/D6 最重；网格加密后每采样最大变调 ±3 半音（D1/D#1 拉
# -4、顶键 C8 拉 +6，其余 ≤±3），全部落在客户端钳制 [0.5, 2.0] 内。
# base-pitch = 2^((60-midi)/12) × 实测校正（tools/piano-endings.py 会打印校正值）。
piano:
  display-name: "三角钢琴"
  entry: world
  release-mode: sustain
  semitone-range: [-39, 48]   # A0~C8：标准 88 键全域（0.7.4，两端各加一锚点八度）
  volume: 1.2
  max-polyphony: 10           # 十指乐器：超 6 复音的真弹 MIDI 不再收敛单旋律（0.7.5）
  category: RECORDS
  voices:
    - { min: -39, max: -35, sound: "chord:piano.as0.%d", base-pitch: 8.9353 }    # A#0 采样（A0 拉 -1 半音起）
    - { min: -34, max: -27, sound: "chord:piano.fs1.%d", base-pitch: 5.6446 }
    - { min: -26, max: -21, sound: "chord:piano.c2.%d",  base-pitch: 3.9925 }
    - { min: -20, max: -15, sound: "chord:piano.fs2.%d", base-pitch: 2.8180 }
    - { min: -14, max: -9,  sound: "chord:piano.c3.%d",  base-pitch: 1.9933 }
    - { min: -8,  max: -3,  sound: "chord:piano.fs3.%d", base-pitch: 1.4120 }
    - { min: -2,  max: 3,   sound: "chord:piano.c4.%d",  base-pitch: 0.9967 }
    - { min: 4,   max: 9,   sound: "chord:piano.fs4.%d", base-pitch: 0.7082 }
    - { min: 10,  max: 15,  sound: "chord:piano.c5.%d",  base-pitch: 0.5012 }
    - { min: 16,  max: 21,  sound: "chord:piano.fs5.%d", base-pitch: 0.3540 }
    - { min: 22,  max: 27,  sound: "chord:piano.c6.%d",  base-pitch: 0.2496 }      # 失真带 B5/C6/D6 落此锚点 ±3 内
    - { min: 28,  max: 33,  sound: "chord:piano.fs6.%d", base-pitch: 0.1773 }
    - { min: 34,  max: 39,  sound: "chord:piano.c7.%d",  base-pitch: 0.1241 }
    - { min: 40,  max: 48,  sound: "chord:piano.fs7.%d", base-pitch: 0.0875 }  # 顶键 C8 = +6（钳制内 1.414）
  # 力度分层：区间外的力度回落到上面常规 voices（64~113 = vl3 常规层）；柔音 vl2 / 强音 vl4
  layers:
    - min-velocity: 1
      max-velocity: 63
      voices:
        - { min: -39, max: -35, sound: "chord:piano.soft.as0.%d", base-pitch: 8.9353 }
        - { min: -34, max: -27, sound: "chord:piano.soft.fs1.%d", base-pitch: 5.6446 }
        - { min: -26, max: -21, sound: "chord:piano.soft.c2.%d",  base-pitch: 3.9925 }
        - { min: -20, max: -15, sound: "chord:piano.soft.fs2.%d", base-pitch: 2.8180 }
        - { min: -14, max: -9,  sound: "chord:piano.soft.c3.%d",  base-pitch: 1.9933 }
        - { min: -8,  max: -3,  sound: "chord:piano.soft.fs3.%d", base-pitch: 1.4120 }
        - { min: -2,  max: 3,   sound: "chord:piano.soft.c4.%d",  base-pitch: 0.9967 }
        - { min: 4,   max: 9,   sound: "chord:piano.soft.fs4.%d", base-pitch: 0.7082 }
        - { min: 10,  max: 15,  sound: "chord:piano.soft.c5.%d",  base-pitch: 0.5012 }
        - { min: 16,  max: 21,  sound: "chord:piano.soft.fs5.%d", base-pitch: 0.3540 }
        - { min: 22,  max: 27,  sound: "chord:piano.soft.c6.%d",  base-pitch: 0.2496 }
        - { min: 28,  max: 33,  sound: "chord:piano.soft.fs6.%d", base-pitch: 0.1773 }
        - { min: 34,  max: 39,  sound: "chord:piano.soft.c7.%d",  base-pitch: 0.1241 }
        - { min: 40,  max: 48,  sound: "chord:piano.soft.fs7.%d", base-pitch: 0.0875 }
    - min-velocity: 114
      max-velocity: 127
      voices:
        - { min: -39, max: -35, sound: "chord:piano.loud.as0.%d", base-pitch: 8.9353 }
        - { min: -34, max: -27, sound: "chord:piano.loud.fs1.%d", base-pitch: 5.6446 }
        - { min: -26, max: -21, sound: "chord:piano.loud.c2.%d",  base-pitch: 3.9925 }
        - { min: -20, max: -15, sound: "chord:piano.loud.fs2.%d", base-pitch: 2.8180 }
        - { min: -14, max: -9,  sound: "chord:piano.loud.c3.%d",  base-pitch: 1.9933 }
        - { min: -8,  max: -3,  sound: "chord:piano.loud.fs3.%d", base-pitch: 1.4120 }
        - { min: -2,  max: 3,   sound: "chord:piano.loud.c4.%d",  base-pitch: 0.9967 }
        - { min: 4,   max: 9,   sound: "chord:piano.loud.fs4.%d", base-pitch: 0.7082 }
        - { min: 10,  max: 15,  sound: "chord:piano.loud.c5.%d",  base-pitch: 0.5012 }
        - { min: 16,  max: 21,  sound: "chord:piano.loud.fs5.%d", base-pitch: 0.3540 }
        - { min: 22,  max: 27,  sound: "chord:piano.loud.c6.%d",  base-pitch: 0.2496 }
        - { min: 28,  max: 33,  sound: "chord:piano.loud.fs6.%d", base-pitch: 0.1773 }
        - { min: 34,  max: 39,  sound: "chord:piano.loud.c7.%d",  base-pitch: 0.1241 }
        - { min: 40,  max: 48,  sound: "chord:piano.loud.fs7.%d", base-pitch: 0.0875 }
  fallback-voices:
    - { min: -12, max: 12, sound: "block.note_block.harp", base-pitch: 1.0 }
  # 制音尾音（0.8.1 压头 + 短保持短尾）：松键制音/松踏板/闷音时，stopSound
  # 硬切后叠加同源收音。档位由 tools/piano-endings.py 沿主采样实测电平曲线
  # 等间隔切档（起点 0.18s 避开 attack 残余区，t0..tn），「素材位置≈保持时长」：
  # 服务端 gradeFor 混合规则选档 + tailGain 按曲线插值折算 volume，把尾音的
  # 电平/衰减斜率/音色三者接上松键那一刻。level-db 为 100ms 窗 RMS 三点平滑
  # + 单调化。全部尾音素材带 100ms/-6dB 压头（松键后尾音先播、主音延迟 2 tick
  # 才 stopSound，压头把重叠期的和包络压平，消除「又弹了一下」；duck 时长与
  # PlayMessageListener.MAIN_STOP_DELAY_TICKS 互锚）。short-sound = 短保持
  # （<SHORT_TAIL_HELD_MS）专用 0.3s 短尾（断奏=制音器快速掐弦）。
  # 改档位/曲线一律重跑 piano-endings.py + 本脚本，勿手改。
  release-voices:
    - { min: -39, max: -35, base-pitch: 8.9353, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.as0.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-12.94, -13.91, -14.74, -15.36, -15.62, -16.11, -16.55, -17.36, -18.26, -19.44, -20.62, -21.5, -22.2, -22.46, -22.59],
        sounds: ["chord:piano.rel.as0.t0", "chord:piano.rel.as0.t1", "chord:piano.rel.as0.t2", "chord:piano.rel.as0.t3"] }
    - { min: -34, max: -27, base-pitch: 5.6446, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.fs1.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-13.9, -16.16, -18.25, -20.09, -21.69, -22.6, -22.97, -23.02, -23.02, -23.02, -23.02, -23.02, -23.02, -23.51, -24.89],
        sounds: ["chord:piano.rel.fs1.t0", "chord:piano.rel.fs1.t1", "chord:piano.rel.fs1.t2", "chord:piano.rel.fs1.t3"] }
    - { min: -26, max: -21, base-pitch: 3.9925, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.c2.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-13.92, -17.05, -19.06, -20.33, -21.51, -23.39, -24.81, -25.95, -26.29, -26.57, -26.57, -26.76, -27.49, -28.19, -28.5],
        sounds: ["chord:piano.rel.c2.t0", "chord:piano.rel.c2.t1", "chord:piano.rel.c2.t2", "chord:piano.rel.c2.t3"] }
    - { min: -20, max: -15, base-pitch: 2.818, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.fs2.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-13.03, -15.12, -17.81, -20.25, -21.85, -22.2, -22.4, -22.83, -24.06, -26.09, -28.32, -29.63, -29.63, -29.63, -29.63],
        sounds: ["chord:piano.rel.fs2.t0", "chord:piano.rel.fs2.t1", "chord:piano.rel.fs2.t2", "chord:piano.rel.fs2.t3"] }
    - { min: -14, max: -9, base-pitch: 1.9933, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.c3.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-10.51, -14.6, -17.56, -19.82, -22.26, -24.42, -25.14, -25.14, -25.14, -25.92, -27.27, -28.06, -28.41, -29.66, -32.39],
        sounds: ["chord:piano.rel.c3.t0", "chord:piano.rel.c3.t1", "chord:piano.rel.c3.t2", "chord:piano.rel.c3.t3"] }
    - { min: -8, max: -3, base-pitch: 1.412, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.fs3.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-11.5, -13.13, -14.49, -16.15, -18.6, -21.08, -22.6, -23.48, -24.19, -25.07, -26.29, -27.66, -29.36, -31.14, -33.02],
        sounds: ["chord:piano.rel.fs3.t0", "chord:piano.rel.fs3.t1", "chord:piano.rel.fs3.t2", "chord:piano.rel.fs3.t3"] }
    - { min: -2, max: 3, base-pitch: 0.9967, held-ms: [180, 350, 550, 1100], short-sound: "chord:piano.rel.c4.ts",
        level-ms: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800],
        level-db: [-11.08, -14.09, -17.26, -20.59, -23.14, -25.13, -26.76, -28.55, -29.34, -29.34, -29.57, -30.89, -33.71, -36.17, -38.5],
        sounds: ["chord:piano.rel.c4.t0", "chord:piano.rel.c4.t1", "chord:piano.rel.c4.t2", "chord:piano.rel.c4.t3"] }
