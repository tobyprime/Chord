# 手持拉弦乐器：release-mode stop（弓离弦即止音，硬切物理上成立，同口琴）。
# 小提琴采样 VSCO 2 CE "SViolinVib"（Versilian Studios 独奏小提琴揉弦延音，CC0），
# 15 锚点 G3~C7（G/A/C/E 网格，间距 2~4 半音）× p/f 双力度层（0.8.0）。
# 音域 G3~E7 = [-5, +40]：真实音域直接放开（底部不做采样下探假音——口琴章
# 「下探把音色压窄」的教训），顶部 C7 锚点上探 +4 到 E7（拉伸后 pitch 1.26，
# 钳制内）；默认音级键可达 [0, +25]，低音 G3~B3 与高音区经直排音/八度修饰键演奏。
# 键位窗口沿用 patch 原生键位表（就近路由，最大拉伸 ±2 半音，透明变速）。
# p/f 两层都 RMS 对齐 −11.3dB（口琴同一混音基准）：层切换只变音色（弓压/亮度）
# 不变响度，避免 63/64 力度边界跳变，强弱动态交给 velocityScale 连续缩放。
# 重取/改档：python tools/violin-rebuild.py（S3 包 HTTP Range 局部抽取，
# 勿整包下载 776MB；改锚点必须重跑，勿手改 base-pitch）。
violin:
  display-name: "小提琴"
  base-item: STICK
  release-mode: stop
  semitone-range: [-5, 40]   # G3~E7：低5 ~ 高高高3（顶部 C7 锚点拉 +4 到 E7）
  volume: 1.0
  max-polyphony: 6           # 旋律乐器：自动单音收敛阈值默认值（双音/三音和弦有余量）
  category: RECORDS
  voices:
    - { min: -5, max: -5, sound: "chord:violin.g3.%d",  base-pitch: 1.3363965 }  # G3 实测
    - { min: -4, max: -2, sound: "chord:violin.a3.%d",  base-pitch: 1.1891861 }  # A3 实测
    - { min: -1, max: 1,  sound: "chord:violin.c4.%d",  base-pitch: 1.0003563 }  # C4 实测
    - { min: 2,  max: 5,  sound: "chord:violin.e4.%d",  base-pitch: 0.7918862 }  # E4 实测
    - { min: 6,  max: 7,  sound: "chord:violin.g4.%d",  base-pitch: 0.6666818 }  # G4 实测
    - { min: 8,  max: 10, sound: "chord:violin.a4.%d",  base-pitch: 0.5906024 }  # A4 实测
    - { min: 11, max: 13, sound: "chord:violin.c5.%d",  base-pitch: 0.4989545 }  # C5 实测
    - { min: 14, max: 17, sound: "chord:violin.e5.%d",  base-pitch: 0.3979779 }  # E5 实测
    - { min: 18, max: 19, sound: "chord:violin.g5.%d",  base-pitch: 0.3345810 }  # G5 实测
    - { min: 20, max: 22, sound: "chord:violin.a5.%d",  base-pitch: 0.2983060 }  # A5 实测
    - { min: 23, max: 25, sound: "chord:violin.c6.%d",  base-pitch: 0.2534468 }  # C6 实测
    - { min: 26, max: 29, sound: "chord:violin.e6.%d",  base-pitch: 0.1969409 }  # E6 实测
    - { min: 30, max: 31, sound: "chord:violin.g6.%d",  base-pitch: 0.1648096 }  # G6 实测
    - { min: 32, max: 34, sound: "chord:violin.a6.%d",  base-pitch: 0.1485453 }  # A6 实测
    - { min: 35, max: 40, sound: "chord:violin.c7.%d",  base-pitch: 0.1245290 }  # C7 实测（+4 顶 E7）
  # 力度分层：柔音 vl-p（velocity 1~63，弱弓/暗音色）；64~127 回落常规 voices（vl-f）
  layers:
    - min-velocity: 1
      max-velocity: 63
      voices:
        - { min: -5, max: -5, sound: "chord:violin.soft.g3.%d",  base-pitch: 1.3371649 }  # G3 实测
        - { min: -4, max: -2, sound: "chord:violin.soft.a3.%d",  base-pitch: 1.1873313 }  # A3 实测
