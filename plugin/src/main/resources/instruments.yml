  display-name: "唢呐"
  base-item: BLAZE_ROD
  release-mode: stop
  semitone-range: [0, 31]    # C4~G6：低1 ~ 高高5（高音主奏定位，默认键达 +25，顶部经直排音）
  volume: 1.0
