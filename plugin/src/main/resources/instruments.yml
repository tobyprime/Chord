    - { min: 11, max: 14, sound: "chord:suona.c5.%d", base-pitch: 0.5006731 }  # C5 实测
    - { min: 15, max: 17, sound: "chord:suona.e5.%d", base-pitch: 0.3969589 }  # E5 实测
    - { min: 18, max: 20, sound: "chord:suona.g5.%d", base-pitch: 0.3342714 }  # G5 实测
    - { min: 21, max: 22, sound: "chord:suona.a5.%d", base-pitch: 0.2978681 }  # A5 实测
