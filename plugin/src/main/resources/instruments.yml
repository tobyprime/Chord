# 手持吹奏乐器：release-mode stop（气息停即止音，同口琴）。
# 唢呐采样（0.9.0）：无现成 CC0 唢呐采样库（商业 Kong Audio 不免费；freesound
# 登录墙；GM Shanai 补丁授权来源不清），素材为 tools/suona-synth.py 原创合成
# ——带限锯齿加法合成 + 喇叭口共振峰 + 打音上滑起振 + 迟起颤音，逐锚点固定
# 种子可复现；日后拿到真人录音按 harmonica-rebuild 流程替换，voices 由脚本
# 重新生成。11 锚点 C/E/G 网格（C4~G6，间距 ≤4 半音），每采样最大拉伸 ±2 半音；
# 全音域亮度统一（频谱质心 3.4~3.8kHz）：低中音区谐波形满显双簧「嗡」，高音区
