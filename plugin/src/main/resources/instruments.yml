# 拨弦类乐器：release-mode decay（松键自然衰减，K 止音 = 手掌闷音）。
# 吉他采样 freepats Spanish Classical Guitar（CC0），实测锚点 C3(+1.4c)/E4(+1.4c)/G5(−2.0c)
# ——偏差 ≤2 音分，不校正；高音锚点自然衰减仅 1.13s（尼龙高音区物理极限）。
# 音域 E2~E6 = 相对 C4 的 [-20, +28]（六弦标准调弦全域）。
# base-pitch 换算细则与采样实测见 assets/resourcepack/README.md——换采样必须同步改这里。
guitar:
  display-name: "民谣吉他"
  base-item: WOODEN_HOE
  release-mode: decay
  semitone-range: [-20, 28]
  volume: 1.1
  max-polyphony: 6
  category: RECORDS
  voices:
    - { min: -20, max: 0,  sound: "chord:guitar.low.%d",  base-pitch: 2.0 }
    - { min: 1,   max: 16, sound: "chord:guitar.mid.%d",  base-pitch: 0.7937006 }
    - { min: 17,  max: 28, sound: "chord:guitar.high.%d", base-pitch: 0.3337158 }
  fallback-voices:
    - { min: -12, max: 12, sound: "block.note_block.guitar", base-pitch: 1.0 }

# 电贝斯：采样 karoryfer Black-And-Blue "darkblack"（CC0）。注意该库文件名八度
# 比科学音名高一个八度（e4 文件 = 实测 E3），锚点以实测为准：
# C2（65.4Hz，−0.7c 忽略）/ E3（164.1Hz，−7.6c 已按实测校正）/ E4（325.6Hz，−21.3c 已校正，
# 库内最高采样只到 E4，高把位原声偏平为乐器音准、输出端校正）。
# 音域 E1~C5 = [-29, +12]（四弦 20 品全域）。low 层 base-pitch 4.0 = C2 采样相对
# 中心音低 24 半音的换算值；窗口内每音最终 pitch = base-pitch × 2^(s/12) 恒在 [0.5, 2.0]。
# mid/high 边界取 +3/+4：E4 锚点层从 +4 起（shift=0 音准最佳），mid 层顶 +3 避开 2.0 钳制缘。
bass:
  display-name: "电贝斯"
  base-item: IRON_HOE
  release-mode: decay
  semitone-range: [-29, 12]
  volume: 1.1
  max-polyphony: 6
  category: RECORDS
  voices:
    - { min: -29, max: -12, sound: "chord:bass.low.%d",  base-pitch: 4.0 }
    - { min: -11, max: 3,   sound: "chord:bass.mid.%d",  base-pitch: 1.5943130 }
    - { min: 4,   max: 12,  sound: "chord:bass.high.%d", base-pitch: 0.8035140 }
  fallback-voices:
    - { min: -12, max: 12, sound: "block.note_block.bass", base-pitch: 1.0 }

# 架子鼓（世界装置乐器，放在地上右键演奏；CraftEngine 家具 world-bind 或
# /chord piano spawn drums 兜底）。
# 打击乐布局：12 半音 = 12 个鼓件，按八度周期重复（八度修饰键在副本间平移，
# 每个副本是同一套鼓）。fixed: true = 音高恒定不变调；label 下发客户端 HUD
# 显示鼓件名。8 个音级键默认位：Z=大鼓 X=小鼓 C=闭镲 V=开镲 B=高嗵 N=低嗵
# M=叮镲 ,=大鼓(高八度位)；半音位（±1 修饰键/直排音）给到 副鼓/鼓边/踩镲/中嗵/重镲。
# 鼓件是无 %d 的一次性采样事件：不进活跃音表——不受和弦上限约束（鼓滚奏需要）、
# 无逐音止音（K 止音对鼓无效；开镲/镲片自然衰减完毕）。
# 中嗵 = 高嗵采样 base-pitch 0.891（下移 2 半音当独立鼓用）。
drums:
  display-name: "架子鼓"
  entry: world
  release-mode: decay
  semitone-range: [-12, 23]
  volume: 1.6   # 0.7.2e：鼓组按响度重母带后仍整体偏轻的用户反馈，提到 1.6（≈25.6 格可听距离）
  max-polyphony: 6
  category: RECORDS
  voices:
    - { min: -12, max: -11, sound: "chord:drums.kick", fixed: true, label: "大鼓" }
    - { min: -10, max: -10, sound: "chord:drums.snare", fixed: true, label: "小鼓" }
    - { min: -9, max: -9, sound: "chord:drums.rim", fixed: true, label: "鼓边" }
    - { min: -8, max: -8, sound: "chord:drums.hat.closed", fixed: true, label: "闭镲" }
    - { min: -7, max: -7, sound: "chord:drums.hat.open", fixed: true, label: "开镲" }
    - { min: -6, max: -6, sound: "chord:drums.hat.pedal", fixed: true, label: "踩镲" }
    - { min: -5, max: -5, sound: "chord:drums.tom.high", fixed: true, label: "高嗵" }
    - { min: -4, max: -4, sound: "chord:drums.tom.mid", fixed: true, label: "中嗵", base-pitch: 0.891 }
    - { min: -3, max: -3, sound: "chord:drums.tom.floor", fixed: true, label: "低嗵" }
    - { min: -2, max: -2, sound: "chord:drums.crash", fixed: true, label: "重镲" }
