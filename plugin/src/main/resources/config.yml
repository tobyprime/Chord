# Chord 插件配置
#
# 音色/乐器定义在 instruments.yml。

limits:
  # 每玩家每秒 note-on 上限（令牌桶速率；note-off 不计数，天然受活跃音约束）。
  # 注意和弦 + 鼠标修饰键实时变调会把 off/on 成对连发：5 音和弦按住 + 变调一次
  # = 10 个 note-on；0.7.12 起还有实时 MIDI 键盘（快速乐句/刮奏可瞬时 30+ 音），
  # 故默认 40/24，避免正常演奏被限速掐音。旧配置文件需手动同步本值
  notes-per-second: 40
  # 令牌桶容量（瞬时突发上限）
  burst: 24
  # 和弦上限（同时按住未松开的最大音符数）0.7.7 起由各乐器的 max-polyphony 决定
  # （instruments.yml，钢琴 10 / 旋律乐器 6），不再使用本文件的全局值

# 演奏时是否必须手持对应乐器物品（防伪造包）
require-held-instrument: true

broadcast:
  # 演奏者自己是否也听到服务端广播回来的演奏（V1 默认含演奏者，见设计文档 §9）
  include-performer: true

effects:
  # 演奏时在演奏者头顶冒音符粒子（音高映射色相，对所有玩家可见）
  note-particles: true
  # 自动演奏的区分特效：音符一律金色并带白色光点，起止时头顶爆发一簇粒子。
  # 不做聊天栏广播——周围玩家靠特效分辨是否自动演奏，听不到的人不被打扰
  auto-particles: true
  # 钢琴（sustain 乐器）松键制音方式（三选一）：
  #   direct（当前试验默认，0.8.1）——松键同刻播尾音采样并立即停主音，无对冲窗。
  #     拼接质量只取决于尾音实例的引擎可听时延 L：L≈0 时近乎无缝，L 每 +10ms 多
  #     10ms 静默缝（本地复现 spec_l0.png）；warm 事件缝小，冷首击（本次会话第一次
  #     播某档尾音）缝明显。尾音素材已去掉压头（压头只对交叠方案有意义）。
  #   natural-delay——不播尾音采样，主音沿电平曲线自然衰减「再降 6dB」时长
  #     （120~600ms）后无声 stopSound。单实例无拼接，台阶构造上不存在；
  #     代价 = 松开后低音多延 ~0.6s 再轻切（接近踏板听感）。
  #   tail-voices——同 direct 的「尾音先行 + 延迟停主音」，延迟用下面的独立旋钮
  #     （0.7.16j 对冲语义）。台阶随时延方差波动，仅作对照保留。
  piano-damper-mode: direct
  # 尾音延迟（毫秒，direct 模式生效，**支持负数**）：主音 stopSound 与尾音起振的时序偏移。
  #   n > 0  主音先停 → n ms 后放尾音（切口留出 n ms 可听静默）
  #   n = 0  停完即放（同批次，warm 事件近无缝）
  #   n < 0  交叠：尾音先响 |n| ms，主音才停（可被同半音重击/踏板接住取消）
  # 调参：切口「尾音抢跑有叠感」→ 加大 n；「断太久尾音才来」→ 减小 n（含负数）。
  # 实际缝 = n + 尾音实例引擎时延 L（warm ~5-15ms，冷首击 100ms+，客户端按帧启动
  # 可听粒度 ~50ms）。建议步进 20~50ms，范围 -500~2000。/chord reload 热生效。
  piano-tail-delay-ms: 0
